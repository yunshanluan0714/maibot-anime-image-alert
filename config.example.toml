# 复制为 config.toml 或直接在 MaiBot WebUI 插件配置页修改；严禁将含 API Key 或个人账号的 config.toml 提交到仓库。

[plugin]
enabled = true
config_version = "1.4.0"

[alert]
# 仅对白名单 QQ 群生效；groups 或 target_user_id 任一留空时插件自动待命，不触发识别与提醒
groups = []
target_user_id = ""
cooldown_seconds = 0
hourly_limit = 0
skip_when_replied_without_source = true
reply_grace_seconds = 6

[source]
enabled = true
enable_planner_tool = true
include_link = true
localize_names = true
saucenao_api_key = ""
serpapi_api_key = ""
# 安全与隐私开关：默认关闭。仅当同时填写 serpapi_api_key 且手动设为 true 时，
# 才会在 SauceNAO 未命中时将命中的群聊图片上传至第三方短期临时图床供 Google Lens / Bing 反搜
allow_temp_image_upload = false
proxy_url = ""
min_similarity = 80.0
timeout_seconds = 25
